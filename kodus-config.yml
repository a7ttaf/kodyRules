summary:
  customInstructions: |
    Summaries must call out Hunter, Phantom, shared database, Prisma/MariaDB,
    authentication, secrets, callbacks, Docker, install/deploy, CI, and
    observability impact when those areas are touched. Keep implementation
    claims separate from validation evidence and name skipped gates explicitly.
  behaviourForNewCommits: replace
  behaviourForExistingDescription: concatenate
