title: Avoid unsafe type assertions
rule: >-
  Detect cases of unsafe type assertions. These do not perform runtime checks
  and can lead to unexpected runtime errors. Recommend using proper type guards
  instead.
severity: high
examples:
  - snippet: |-
      const element = document.getElementById("myId") as HTMLInputElement;
      element.value = "Hello"; // Unsafe if the element is not an input
    isCorrect: false
  - snippet: |
      const element = document.getElementById("myId");
      if (element instanceof HTMLInputElement) {
        element.value = "Hello";
      }
    isCorrect: true
