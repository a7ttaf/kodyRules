title: Always validate JSON parsing
rule: >-
  Ensure that JSON data is validated before parsing. Parsing untrusted JSON
  without validation can result in runtime errors or vulnerabilities.
severity: low
examples:
  - snippet: const data = JSON.parse(userInput); // No validation
    isCorrect: false
  - snippet: |
      try {
        const data = JSON.parse(userInput);
        if (typeof data !== 'object' || Array.isArray(data)) {
          throw new Error('Invalid JSON structure');
        }
      } catch (err) {
        console.error('JSON parsing error:', err);
      }
    isCorrect: true
